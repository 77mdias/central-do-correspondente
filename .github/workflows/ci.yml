name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  db:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: central }
        ports: ["5435:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 3s --health-retries 30
      # anexos (fase 2): os testes de rota enviam e baixam do S3
      s3:
        image: adobe/s3mock:5.2.3
        env: { COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: documentos }
        ports: ["9093:9090"]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: psql postgres://postgres:postgres@localhost:5435/central -v ON_ERROR_STOP=1 -f docker/postgres/init/01-papeis.sql
      - run: pnpm test:db
      - run: pnpm test:worker

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: central }
        ports: ["5435:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 3s --health-retries 30
      mailpit:
        image: axllent/mailpit:v1.27
        ports: ["1028:1025", "8028:8025"]
      s3:
        image: adobe/s3mock:5.2.3
        env: { COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: documentos }
        ports: ["9093:9090"]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: psql postgres://postgres:postgres@localhost:5435/central -v ON_ERROR_STOP=1 -f docker/postgres/init/01-papeis.sql
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with: { name: playwright-report, path: playwright-report, retention-days: 7 }
